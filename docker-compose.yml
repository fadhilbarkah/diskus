services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diskus-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/sqlite.db
      # You should set these in a .env file at the root level, or export them in your shell
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret-key}
      - DASHBOARD_ORIGIN=${DASHBOARD_ORIGIN:-*}
      - RESEND_SENDER_EMAIL=${RESEND_SENDER_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    volumes:
      - diskus-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # For production, this should be the absolute URL of your Diskus API
        # e.g., https://comments.yourdomain.com/api/v1
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api/v1}
    container_name: diskus-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  diskus-data:
