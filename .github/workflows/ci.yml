name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JWT_SECRET: "test-secret-key-that-is-at-least-32-chars-long"
  NODE_ENV: "test"
  VITE_API_URL: "http://localhost:3000"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"
      - run: bun install --frozen-lockfile
      - name: Create .env for backend tests
        working-directory: backend
        run: |
          echo "JWT_SECRET=test-secret-key-ci-only-not-for-production" > .env
          echo "NODE_ENV=test" >> .env
          echo "API_URL=http://localhost:3000" >> .env
      - name: Run backend tests
        working-directory: backend
        run: bun test

  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"
      - run: bun install --frozen-lockfile
      - name: Create .env for dashboard tests
        working-directory: dashboard
        run: |
          echo "VITE_API_URL=http://localhost:3000" > .env
      - name: Run dashboard tests
        working-directory: dashboard
        run: bun run test

  test-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"
      - run: bun install --frozen-lockfile
      - name: Run widget tests
        working-directory: widget
        run: bun run test
